<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 145 132" fill="none" overflow="visible" role="img" aria-labelledby="title desc">
  <title id="title">Luminous Nemu mark</title>
  <desc id="desc">A glowing blue and violet letter N formed by three rounded strokes.</desc>
  <defs>
    <linearGradient id="side-gradient" x1="28" y1="3" x2="28" y2="129" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#775FFF"/>
      <stop offset="1" stop-color="#24C8FF"/>
    </linearGradient>
    <linearGradient id="core-gradient" x1="39.508" y1="17.087" x2="105.492" y2="114.913" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38DCFF"/>
      <stop offset="0.68" stop-color="#6B5EFF"/>
      <stop offset="1" stop-color="#755CFF"/>
    </linearGradient>
    <filter id="soft-glow" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#4285FF" flood-opacity="0.48"/>
    </filter>
    <g id="nemu-strokes">
      <path d="M28 18V114" stroke="url(#side-gradient)" stroke-width="30" stroke-linecap="round"/>
      <path d="M117 18V114" stroke="url(#side-gradient)" stroke-width="30" stroke-linecap="round"/>
      <path d="M39.508 17.087 105.492 114.913" stroke="url(#core-gradient)" stroke-width="30" stroke-linecap="round"/>
    </g>
  </defs>
  <use href="#nemu-strokes" filter="url(#soft-glow)"/>
</svg>
