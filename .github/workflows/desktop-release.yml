name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rustTargets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            platform: macos-13
            rustTargets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Linux x64
            platform: ubuntu-22.04
            rustTargets: ""
            args: --bundles deb,appimage
          - name: Windows x64
            platform: windows-latest
            rustTargets: ""
            args: --bundles nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Windows scan tooling
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ripgrep -y --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.rustTargets != ''
        run: rustup target add ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Secret fixture grep
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\secret_grep.ps1

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: connlens-v__VERSION__
          releaseName: ConnLens v__VERSION__
          releaseBody: "Cross-platform ConnLens desktop builds. macOS artifacts are ad-hoc signed unless Apple Developer signing and notarization secrets are configured."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
