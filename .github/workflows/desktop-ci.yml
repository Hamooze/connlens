name: Desktop validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: UI contracts (WebKit and Chromium)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          CONNLENS_E2E_OUTPUT: ${{ runner.temp }}/connlens-playwright
      - run: node scripts/secret-grep.mjs
      - name: Save UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-evidence
          path: ${{ runner.temp }}/connlens-playwright
          retention-days: 14

  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
            releaseDir: src-tauri/target/aarch64-apple-darwin/release
            executable: connlens
            artifact: macos-arm64
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
            releaseDir: src-tauri/target/x86_64-apple-darwin/release
            executable: connlens
            artifact: macos-x64
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,appimage
            releaseDir: src-tauri/target/release
            executable: connlens
            artifact: linux-x64
          - name: Windows x64
            platform: windows-2022
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
            releaseDir: src-tauri/target/release
            executable: connlens.exe
            artifact: windows-x64
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm test
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Rust tests
        working-directory: src-tauri
        env:
          CONNLENS_HOME: ${{ runner.temp }}/connlens-test-home
        run: cargo test --locked
      - name: Secret fixture grep (PowerShell entry point)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/secret_grep.ps1
      - name: Secret fixture grep
        if: runner.os != 'Windows'
        run: node scripts/secret-grep.mjs
      - name: Build native installers
        run: npm run tauri -- build ${{ matrix.args }}
      - name: Exercise native fixture scan and persisted read contract
        run: node scripts/native-smoke.mjs "${{ matrix.releaseDir }}/${{ matrix.executable }}"
      - name: Validate bundle contents and signatures
        run: node scripts/check-bundles.mjs "${{ matrix.releaseDir }}/bundle"
      - name: Archive macOS app with executable permissions
        if: runner.os == 'macOS'
        run: tar -czf "${{ matrix.releaseDir }}/bundle/ConnLens-${{ matrix.artifact }}.app.tar.gz" -C "${{ matrix.releaseDir }}/bundle/macos" ConnLens.app
      - name: Save verified installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ matrix.releaseDir }}/bundle/*.app.tar.gz
            ${{ matrix.releaseDir }}/bundle/dmg/*.dmg
            ${{ matrix.releaseDir }}/bundle/deb/*.deb
            ${{ matrix.releaseDir }}/bundle/appimage/*.AppImage
            ${{ matrix.releaseDir }}/bundle/nsis/*.exe
