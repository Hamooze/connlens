id = "shopify"
name = "Shopify"
dashboard_url = "https://admin.shopify.com"

[[locations]]
path = "%USERPROFILE%/.config/shopify/config.json"
format = "json"
strategy = "token_file"
source_type = "config_file"
confidence = "candidate"

[[locations]]
path = "%APPDATA%/shopify-app-account-info-nodejs/Config/config.json"
format = "json"
strategy = "shopify_account_info"
source_type = "config_file"
confidence = "account_cache"

[[env_vars]]
name = "SHOPIFY_CLI_AUTH_TOKEN"
label = "Shopify CLI token"
