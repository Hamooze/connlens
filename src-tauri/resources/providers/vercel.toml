id = "vercel"
name = "Vercel"
dashboard_url = "https://vercel.com"

[[locations]]
path = "%APPDATA%/com.vercel.cli/auth.json"
format = "json"
strategy = "token_file"
source_type = "config_file"

[[locations]]
path = "%LOCALAPPDATA%/com.vercel.cli/auth.json"
format = "json"
strategy = "token_file"
source_type = "config_file"

[[locations]]
path = "%USERPROFILE%/.local/share/com.vercel.cli/auth.json"
format = "json"
strategy = "token_file"
source_type = "config_file"

[[locations]]
path = "%USERPROFILE%/.vercel/auth.json"
format = "json"
strategy = "token_file"
source_type = "config_file"

[[locations]]
path = "%APPDATA%/com.vercel.cli/config.json"
format = "json"
strategy = "token_file"
source_type = "config_file"
confidence = "candidate"

[[locations]]
path = "%USERPROFILE%/.vercel/config.json"
format = "json"
strategy = "token_file"
source_type = "config_file"
confidence = "candidate"

[[locations]]
path = "$PROJECT_ROOTS/.vercel/project.json"
format = "json"
strategy = "vercel_project"
source_type = "config_file"
confidence = "project_link"

[[env_vars]]
name = "VERCEL_TOKEN"
label = "Vercel token"
