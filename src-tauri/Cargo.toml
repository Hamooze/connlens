[package]
name = "connlens"
version = "0.1.0"
description = "Local-only macOS, Windows, and Linux tray utility for developer app connection visibility."
authors = ["Hamza"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "connlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
arboard = "3.6.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0.0"
glob = "0.3"
notify = "8.2"
regex = "1.12"
rust-ini = "0.21.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-core = "=0.61.2"
winreg = "0.56.0"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
trash = "=5.2.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.23"
